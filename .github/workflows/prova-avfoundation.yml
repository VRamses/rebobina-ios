name: Prova AVFoundation

# Temporario: quais membros de AVPlayer sao extensao e quais sao da classe, e teste de compilacao.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    name: Extensoes de AVPlayer e compilacao de uma amostra
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar a distribuicao Kotlin/Native
        run: ./gradlew -q :composeApp:downloadKotlinNativeDistribution --console=plain

      - name: Classe AVPlayer e extensoes
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          PRE="$K/klib/platform/ios_arm64/org.jetbrains.kotlin.native.platform.AVFoundation"
          "$K/bin/klib" dump-metadata "$PRE" > /tmp/meta.txt 2>&1 || echo "dump saiu com $?"
          echo "linhas: $(wc -l < /tmp/meta.txt)"
          echo "=== declaracao da classe ==="
          grep -n "class platform/AVFoundation/AVPlayer :" /tmp/meta.txt || true
          echo "=== extensoes declaradas com receiver AVPlayer ==="
          grep -n "fun platform/AVFoundation/AVPlayer\." /tmp/meta.txt || true
          echo "=== propriedades extensao com receiver AVPlayer ==="
          grep -n "val platform/AVFoundation/AVPlayer\." /tmp/meta.txt || true
          echo "=== bloco da classe ==="
          awk '/public open class platform\/AVFoundation\/AVPlayer :/{f=1} f{print;c++} c>150{exit}' /tmp/meta.txt || true

      - name: Compilar amostra com imports explicitos
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          cat > /tmp/amostra.kt <<'EOF'
          import kotlinx.cinterop.ExperimentalForeignApi
          import platform.AVFoundation.AVPlayer
          import platform.AVFoundation.AVPlayerItem
          import platform.AVFoundation.addPeriodicTimeObserverForInterval
          import platform.AVFoundation.removeTimeObserver
          import platform.AVFoundation.seekToTime
          import platform.AVFoundation.play
          import platform.AVFoundation.pause
          import platform.AVFoundation.currentItem
          import platform.CoreMedia.CMTimeMakeWithSeconds
          import platform.CoreMedia.CMTimeGetSeconds
          import platform.Foundation.NSURL
          import platform.darwin.dispatch_get_main_queue

          @OptIn(ExperimentalForeignApi::class)
          fun amostra(url: NSURL) {
              val p = AVPlayer(playerItem = AVPlayerItem(uRL = url))
              val vigia = p.addPeriodicTimeObserverForInterval(
                  interval = CMTimeMakeWithSeconds(5.0, 600),
                  queue = dispatch_get_main_queue(),
                  usingBlock = { tempo -> println("t=" + CMTimeGetSeconds(tempo)) },
              )
              p.seekToTime(CMTimeMakeWithSeconds(1.0, 600))
              p.play()
              p.pause()
              println(p.currentItem)
              p.removeTimeObserver(vigia)
          }
          EOF
          "$K/bin/konanc" -target ios_arm64 -p library -o /tmp/amostra /tmp/amostra.kt 2>&1 | head -40 || true
