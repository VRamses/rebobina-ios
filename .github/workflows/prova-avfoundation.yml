name: Prova AVFoundation

# Temporario: lista os membros que a platform lib do AVFoundation expoe em AVPlayer.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    name: Membros de AVPlayer na platform lib
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar a distribuicao Kotlin/Native
        run: ./gradlew -q :composeApp:downloadKotlinNativeDistribution --console=plain

      - name: Conteudo do klib do AVFoundation
        run: |
          set -uo pipefail
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          LIB="$K/klib/platform/ios_arm64/org.jetbrains.kotlin.native.platform.AVFoundation"
          echo "LIB=$LIB"
          ls "$LIB" || true
          "$K/bin/klib" contents "$LIB" > /tmp/av.txt 2>&1
          echo "codigo de saida do klib: $?"
          echo "linhas: $(wc -l < /tmp/av.txt)"
          echo "--- primeiras linhas ---"
          head -6 /tmp/av.txt
          echo "--- contagem ---"
          for t in "class AVPlayer" "addPeriodicTimeObserverForInterval" "removeTimeObserver" "seekToTime" "currentItem" "fun play" "fun pause" "fun rate"; do
            echo "$t => $(grep -c "$t" /tmp/av.txt)"
          done
          echo "--- janela do texto onde aparece AVPlayer ---"
          N=$(grep -n "AVPlayer" /tmp/av.txt | head -1 | cut -d: -f1)
          echo "primeira ocorrencia na linha: ${N:-nenhuma}"
          if [ -n "${N:-}" ]; then
            sed -n "$((N>5 ? N-3 : 1)),$((N+60))p" /tmp/av.txt
          fi
          echo "--- membros procurados no arquivo inteiro ---"
          grep -oE "addPeriodicTimeObserverForInterval|removeTimeObserver|seekToTime|currentItem|play|pause|rate" /tmp/av.txt | sort | uniq -c || true
