name: Prova AVFoundation

# Temporario: lista os membros que a platform lib do AVFoundation realmente expoe em AVPlayer.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    name: Membros de AVPlayer na platform lib
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar a distribuicao Kotlin/Native do projeto
        run: ./gradlew -q :composeApp:downloadKotlinNativeDistribution --console=plain

      - name: Achar a platform lib do AVFoundation
        run: |
          set -euo pipefail
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          echo "K=$K"
          echo "--- klib ---"
          ls "$K/klib"
          echo "--- klib/platform ---"
          ls "$K/klib/platform" | head -20
          echo "--- candidatos AVFoundation ---"
          find "$K/klib" -maxdepth 3 -name "*AVFoundation*" | head -10

      - name: Membros de AVPlayer
        run: |
          set -euo pipefail
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          LIB="$(find "$K/klib" -maxdepth 3 -name "platform.AVFoundation*" | head -1)"
          echo "LIB=$LIB"
          "$K/bin/klib" contents "$LIB" > /tmp/av.txt 2>&1 || true
          echo "linhas: $(wc -l < /tmp/av.txt)"
          echo "--- ocorrencias de AVPlayer ---"
          grep -n "AVPlayer" /tmp/av.txt | head -30
          echo "--- bloco da classe AVPlayer ---"
          awk '/class AVPlayer([ :]|$)/{f=1} f{print; c++} c>70{exit}' /tmp/av.txt
          echo "--- membros procurados ---"
          grep -oE "addPeriodicTimeObserverForInterval|removeTimeObserver|seekToTime|currentItem|play|pause|rate" /tmp/av.txt | sort | uniq -c

      - name: Procurar AVPlayer em outros klibs
        run: |
          set -euo pipefail
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          for LIB in "$K"/klib/platform/ios_*/*AV*; do
            echo "== $LIB"
            "$K/bin/klib" contents "$LIB" 2>/dev/null | grep -cE "addPeriodicTimeObserverForInterval|Unresolved" || true
          done
