name: Prova AVFoundation

# Temporario: compara o klib prebuild de AVFoundation com a cache criada na maquina.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    name: Metadados de AVPlayer nos dois klibs
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar a distribuicao Kotlin/Native
        run: ./gradlew -q :composeApp:downloadKotlinNativeDistribution --console=plain

      - name: Comparar klib prebuild e cache
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          PRE="$K/klib/platform/ios_arm64/org.jetbrains.kotlin.native.platform.AVFoundation"
          CAC="$(ls -d "$K"/klib/cache/ios_arm64-*/org.jetbrains.kotlin.native.platform.AVFoundation-cache 2>/dev/null | head -1)"
          echo "PRE=$PRE"
          echo "CAC=$CAC"
          for L in "$PRE" "$CAC"; do
            echo "############ $L"
            if [ ! -e "$L" ]; then echo "nao existe"; continue; fi
            du -sh "$L" || true
            "$K/bin/klib" info "$L" > /tmp/info.txt 2>&1 || echo "info saiu com $?"
            head -12 /tmp/info.txt || true
            "$K/bin/klib" dump-metadata "$L" > /tmp/meta.txt 2>&1 || echo "dump-metadata saiu com $?"
            echo "linhas de metadados: $(wc -l < /tmp/meta.txt)"
            for t in addPeriodicTimeObserverForInterval removeTimeObserver seekToTime currentItem; do
              echo "  $t => $(grep -c "$t" /tmp/meta.txt)"
            done
            echo "  --- onde aparecem ---"
            grep -n "addPeriodicTimeObserverForInterval\|seekToTime:" /tmp/meta.txt | head -8 || true
            echo "  --- bloco da classe AVPlayer ---"
            awk '/class name: platform\/AVFoundation\/AVPlayer$/{f=1} f{print; c++} c>45{exit}' /tmp/meta.txt || true
          done

      - name: Qual klib o compilador realmente le
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          cd "$GITHUB_WORKSPACE" || exit 1
          ./gradlew :composeApp:compileKotlinIosArm64 --dry-run -q --console=plain > /tmp/dry.txt 2>&1 || echo "dry-run saiu com $?"
          tail -5 /tmp/dry.txt || true
          echo "--- klibs da cache ---"
          ls "$K"/klib/cache/ios_arm64-*/ 2>/dev/null | head -20 || true
