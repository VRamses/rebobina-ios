name: Prova AVFoundation

# Temporario: descobre como inspecionar o klib do AVFoundation na Kotlin 2.4.10.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova:
    name: Inspecionar o klib do AVFoundation
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Baixar a distribuicao Kotlin/Native
        run: ./gradlew -q :composeApp:downloadKotlinNativeDistribution --console=plain

      - name: Ferramenta klib
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          echo "K=$K"
          "$K/bin/klib" --help > /tmp/help.txt 2>&1 || echo "help saiu com $?"
          head -45 /tmp/help.txt || true

      - name: Conteudo do klib
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          LIB="$K/klib/platform/ios_arm64/org.jetbrains.kotlin.native.platform.AVFoundation"
          echo "LIB=$LIB"
          find "$LIB" -maxdepth 3 | head -25 || true
          echo "--- klib contents ---"
          "$K/bin/klib" contents "$LIB" > /tmp/av.txt 2>&1 || echo "contents saiu com $?"
          echo "linhas em /tmp/av.txt: $(wc -l < /tmp/av.txt)"
          head -20 /tmp/av.txt || true
          echo "--- klib dump-metadata ---"
          "$K/bin/klib" dump-metadata "$LIB" > /tmp/av2.txt 2>&1 || echo "dump-metadata saiu com $?"
          echo "linhas em /tmp/av2.txt: $(wc -l < /tmp/av2.txt)"
          head -20 /tmp/av2.txt || true

      - name: Procurar os nomes dentro do klib
        run: |
          K="$(ls -d "$HOME"/.konan/kotlin-native-prebuilt-macos-* | head -1)"
          LIB="$K/klib/platform/ios_arm64/org.jetbrains.kotlin.native.platform.AVFoundation"
          echo "--- grep binario no diretorio do klib ---"
          for t in addPeriodicTimeObserverForInterval removeTimeObserver seekToTime currentItem; do
            echo "$t => $(grep -a -r -l "$t" "$LIB" 2>/dev/null | wc -l) arquivos"
          done
          echo "--- strings nos linkdata ---"
          find "$LIB" -type f | head -10 || true
          find "$LIB" -type f -exec strings -a {} + 2>/dev/null > /tmp/str.txt || true
          echo "linhas de strings: $(wc -l < /tmp/str.txt)"
          for t in AVPlayer addPeriodicTimeObserverForInterval removeTimeObserver seekToTime currentItem play pause rate; do
            echo "$t => $(grep -c -x "$t" /tmp/str.txt)"
          done
          echo "--- linhas com Time e com Player ---"
          grep -iE "TimeObserver|seekTo" /tmp/str.txt | sort -u | head -20 || true
